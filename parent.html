<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学習のようす｜たっけんクエスト</title>
<meta name="theme-color" content="#2f5d8a">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#1f2d3d;--muted:#6b7a8c;--line:#e2e8f0;--blue:#2f6fb0;--green:#2a9d63;--orange:#e8833a;--red:#d9534f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
.app{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--muted)}.kpi b{display:block;font-size:26px;margin-top:2px}.kpi small{font-size:12px;color:var(--muted)}
.kpi.good b{color:var(--green)}.kpi.warn b{color:var(--orange)}
.bar{height:12px;background:#e8eef5;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:999px}
.week{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px}.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:2px}.week .today i{background:var(--orange)}
.week em{font-style:normal;font-size:11px;color:var(--ink);margin-bottom:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.row:first-of-type{border-top:0}
.row .t{color:var(--muted);font-size:12px;white-space:nowrap}.row .s{font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin-right:6px;background:#e8eef5;color:var(--blue)}
.ok{color:var(--green)}.ng{color:var(--red)}.muted{color:var(--muted);font-size:13px}
.lesson{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}.lesson:first-child{border-top:0}
.miss li{font-size:14px;line-height:1.6;margin-bottom:6px}
input{font:inherit;font-size:22px;letter-spacing:2px;text-transform:uppercase;width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;text-align:center;margin:10px 0}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--blue);color:#fff;width:100%;cursor:pointer}
button.ghost{background:transparent;color:var(--blue);width:auto;padding:6px 0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.alert{background:#fff4e5;border:1px solid #f3d3a8;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
'use strict';
// Parent dashboard: reads the summary the kid's app sends (takken_view with the parent code). Read only.
const RPC='https://aevqdsozxiklyjfavvhf.supabase.co/rest/v1/rpc/takken_view',SKEY='sb_publishable_3J-KuCCmuO_d7WLzQrsrTg_U3QiaF_I';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let course=null,code=null;try{code=localStorage.getItem('tkp_code')}catch{}
const day=d=>d.toLocaleDateString('sv-SE'),mins=s=>Math.round((s||0)/60);
function ago(iso){const m=Math.round((Date.now()-Date.parse(iso))/60000);return m<1?'たった今':m<60?m+'分前':m<1440?Math.round(m/60)+'時間前':Math.round(m/1440)+'日前'}
const title=id=>{for(const c of course?.chapters||[])for(const l of c.lessons)if(l.id===id)return l.title;return id||''};
const kindName={lesson:'レッスン',review:'ふくしゅう',game:'ことばゲーム'};

function ask(msg=''){
 app.innerHTML=`<h1>学習のようす</h1><p class="sub">たっけんクエスト・おうちの人用</p><div class="card">
 <p>お子さんのアプリの「せってい」にある<b>おうちの人コード</b>を入れてください。</p>
 <input id="c" maxlength="12" placeholder="XXXX-XXXX-XX" autocomplete="off"><button id="go">見る</button>${msg?`<p class="ng">${msg}</p>`:''}</div>`;
 $('#go').onclick=()=>{const v=$('#c').value.replace(/[^0-9a-z]/gi,'').toUpperCase();if(v.length<10)return ask('コードは10文字です');code=v;try{localStorage.setItem('tkp_code',v)}catch{}load()};
}

async function load(){
 if(!code)return ask();
 try{
  if(!course)course=await (await fetch('data/course.json',{cache:'no-cache'})).json();
  const r=await fetch(RPC,{method:'POST',headers:{apikey:SKEY,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})});
  const rows=await r.json();if(!r.ok)throw Error();
  if(!rows.length)return ask('このコードの記録が見つかりません。お子さんのアプリを一度開いてから、もう一度入れてください。');
  show(rows[0].data,rows[0].updated_at);
 }catch{app.innerHTML+=`<div class="alert">読み込めませんでした。電波を確認して、もう一度お試しください。</div>`}
}

function show(d,updated){
 const now=new Date(),t=day(now),log=d.log||[],time=d.time||{};
 const todayLog=log.filter(e=>day(new Date(e.t))===t);
 const week=[...Array(7)].map((_,i)=>{const x=new Date(now-((6-i)*864e5));return {d:day(x),label:'日月火水木金土'[x.getDay()],s:time[day(x)]||0}});
 const weekMin=week.reduce((a,w)=>a+mins(w.s),0),maxS=Math.max(60,...week.map(w=>w.s));
 const last7=log.filter(e=>now-e.t<7*864e5),ok7=last7.reduce((a,e)=>a+e.ok,0),n7=last7.reduce((a,e)=>a+e.n,0);
 const studiedToday=todayLog.length>0||mins(time[t])>0;
 const quiet=Math.floor((Date.now()-Date.parse(updated))/864e5);
 let lessonsHtml='';
 for(const c of course.chapters){lessonsHtml+=`<div class="muted" style="margin:6px 0 2px">${esc(c.title)}</div>`;
  for(const l of c.lessons){const st=d.stars?.[l.id];lessonsHtml+=`<div class="lesson"><span>${esc(l.title)}${l.id===d.next?' <span class="tag">次はここ</span>':''}</span><span class="${st!==undefined?'ok':'muted'}">${st!==undefined?'★'.repeat(st)||'クリア':'まだ'}</span></div>`}}
 app.innerHTML=`<div class="head"><div><h1>${esc(d.name||'お子さん')}の学習のようす</h1><p class="sub">最後に使ったのは ${ago(updated)}・${esc(d.stage)}（レベル${d.level}）</p></div><button class="ghost" id="rf">更新</button></div>
 ${quiet>=2?`<div class="alert">⚠️ ${quiet}日間アプリを開いていません。声をかけてあげてください。</div>`:''}
 <div class="kpis">
  <div class="kpi ${studiedToday?'good':'warn'}"><span>今日</span><b>${mins(time[t])}分</b><small>${studiedToday?`クイズ ${todayLog.length}回`:'まだ勉強していません'}</small></div>
  <div class="kpi"><span>この7日間</span><b>${weekMin}分</b><small>1日平均 ${Math.round(weekMin/7)}分</small></div>
  <div class="kpi"><span>正答率（7日間）</span><b>${n7?Math.round(ok7/n7*100)+'%':'—'}</b><small>${n7?`${ok7} / ${n7}問`:'記録なし'}</small></div>
  <div class="kpi"><span>連続して勉強</span><b>${d.streak?.days||0}日</b><small>今日のミッション ${d.mission===t?'✅':'まだ'}</small></div>
 </div>
 <div class="card"><h2>勉強した時間（7日間）</h2><div class="week">${week.map(w=>`<div class="${w.d===t?'today':''}"><em>${mins(w.s)||''}</em><i style="height:${Math.round(w.s/maxS*80)}%"></i>${w.label}</div>`).join('')}</div></div>
 <div class="card"><h2>どこまで進んだか</h2><div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>クリアしたレッスン</span><b>${d.lessonsDone} / ${d.lessonsTotal}</b></div><div class="bar"><i style="width:${d.lessonsTotal?d.lessonsDone/d.lessonsTotal*100:0}%"></i></div>
  <div style="margin-top:10px">${lessonsHtml}</div><p class="muted" style="margin:10px 0 0">言葉カード ${d.words} / ${d.wordsTotal}枚・コイン ${d.coins}</p></div>
 <div class="card"><h2>今日やったこと</h2>${todayLog.length?todayLog.slice().reverse().map(e=>`<div class="row"><span><span class="tag">${kindName[e.k]||e.k}</span>${esc(e.k==='game'?'言葉の意味あて':title(e.id))}</span><span class="s ${e.ok===e.n?'ok':''}">${e.ok}/${e.n}</span><span class="t">${new Date(e.t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<p class="muted">まだありません</p>'}</div>
 <div class="card"><h2>まちがえて、まだ復習中の問題</h2>${d.missNow?.length?`<ul class="miss">${d.missNow.map(q=>`<li>${esc(q)}</li>`).join('')}</ul><p class="muted">ここの内容を、ごはんの時などに話題にしてあげると覚えやすくなります。</p>`:'<p class="muted">ありません。よくできています！</p>'}</div>
 <div class="card"><h2>最近の記録</h2>${log.slice(-15).reverse().map(e=>`<div class="row"><span><span class="tag">${kindName[e.k]||e.k}</span>${esc(e.k==='game'?'言葉の意味あて':title(e.id))}</span><span class="s">${e.ok}/${e.n}</span><span class="t">${new Date(e.t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')||'<p class="muted">まだありません</p>'}</div>
 <p class="muted" style="text-align:center">お子さんのアプリを開いている間、約2分ごとに更新されます。<br><button class="ghost" id="out">別のコードを入れる</button></p>`;
 $('#rf').onclick=load;$('#out').onclick=()=>{try{localStorage.removeItem('tkp_code')}catch{}code=null;ask()};
}
load();setInterval(()=>{if(document.visibilityState==='visible'&&code)load()},60000);
</script>
</body>
</html>
