<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>たっけんクエスト</title>
<meta name="theme-color" content="#ff8a3d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ec;--ink:#3b2a1f;--muted:#8a7363;--orange:#ff8a3d;--orange-d:#e86a1c;--pink:#ff6fa5;--blue:#4aa8ff;--green:#2fbf71;--red:#ff5a5f;--yellow:#ffd23f;--card:#fff;--line:#f1dcc6;--shadow:0 4px 0 #f0d3b4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c",system-ui,sans-serif;font-weight:500}
body{min-height:100dvh;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
ruby rt{font-size:.5em;color:var(--muted);font-weight:500}
body.nofuri rt{display:none}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.top .back{width:44px;height:44px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:22px;font-weight:800}
.top .ttl{flex:1;font-weight:800;font-size:18px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);font-weight:800;font-size:15px}
.big{display:block;width:100%;padding:18px;border-radius:20px;font-size:21px;font-weight:800;color:#fff;background:var(--orange);box-shadow:0 6px 0 var(--orange-d);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d)}
.big.blue{background:var(--blue);box-shadow:0 6px 0 #2c84d8}.big.green{background:var(--green);box-shadow:0 6px 0 #1f9658}.big.gray{background:#d9cbbd;box-shadow:0 6px 0 #bfae9c}
.sub{display:block;width:100%;padding:14px;border-radius:16px;font-size:17px;font-weight:800;background:#fff;box-shadow:var(--shadow)}
/* character + bubble */
.stage{display:flex;align-items:flex-end;gap:10px;margin:8px 0}
.stage.right{flex-direction:row-reverse}
.chara{width:110px;height:110px;flex-shrink:0;object-fit:contain;animation:bob 2.4s ease-in-out infinite}
.chara.pop{animation:pop .35s ease-out,bob 2.4s ease-in-out .35s infinite}
.bubble{position:relative;background:#fff;border-radius:22px;padding:14px 16px;font-size:18px;line-height:2.05;box-shadow:var(--shadow);flex:1}
.bubble:after{content:"";position:absolute;left:-10px;bottom:22px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.stage.right .bubble:after{left:auto;right:-10px;border-right:0;border-left:10px solid #fff;border-left-color:#fff}
.bubble .name{display:block;font-size:13px;font-weight:800;line-height:1.4;color:var(--orange-d)}
.stage.right .bubble .name{color:#d1477f}
.w{display:inline;padding:0 2px;margin:0 1px;border-radius:6px;background:#fff1b8;border-bottom:3px solid var(--yellow);font-weight:800;line-height:inherit}
.point{background:linear-gradient(135deg,#fff3c4,#ffe0ec);border:3px solid var(--yellow);border-radius:22px;padding:18px;font-size:18px;line-height:2.1;margin:12px 0;box-shadow:var(--shadow)}
.point b.lbl{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:0 12px;font-size:14px;line-height:1.9;margin-bottom:6px}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* home */
.hello{margin:6px 0 18px}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.meter{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin:14px 0;font:inherit;color:inherit;cursor:pointer}
.meter .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.meter .mh span{font-size:13px;color:var(--muted)}
.gauge{position:relative;height:22px;border-radius:999px;background:#f3e6d8;margin:22px 0 6px}.gauge>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#7fd3ff,var(--green));transition:width .6s}
.gauge em{position:absolute;top:-20px;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:800;color:var(--red);white-space:nowrap}.gauge em:after{content:'';position:absolute;left:50%;top:18px;width:3px;height:26px;background:var(--red);border-radius:2px}
.mscore{font-size:15px}.mscore b{font-size:26px;color:var(--orange-d)}
.fbar{display:grid;grid-template-columns:7.5em 1fr 3.6em;align-items:center;gap:8px;font-size:13px;margin-top:6px}.fbar .t{height:10px;border-radius:999px;background:#f3e6d8;overflow:hidden}.fbar .t i{display:block;height:100%;border-radius:999px}.fbar .n{text-align:right;font-variant-numeric:tabular-nums}
.goalf{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin:12px 0}.goalf h3{margin:0 0 4px;font-size:17px}
.lvl{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);margin:14px 0}
.lvl .bar{height:14px;border-radius:999px;background:#f3e6d8;overflow:hidden;margin-top:8px}.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:999px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:#fff;border-radius:20px;padding:16px 10px;box-shadow:var(--shadow);font-weight:800;font-size:16px;text-align:center}
.tile .ic{font-size:34px;display:block;margin-bottom:4px}
.count{font-size:13px;color:var(--muted);text-align:center;margin-top:16px}
/* map */
.chap{border-radius:24px;padding:16px;margin:10px 0 18px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.chap h2{margin:0;font-size:22px}.chap p{margin:4px 0 0;font-size:14px;opacity:.95}
.path{display:flex;flex-direction:column;align-items:center;gap:58px;padding:6px 0 50px}.chap rt{color:#fff;opacity:.9}
.node{width:86px;height:86px;border-radius:50%;background:#fff;box-shadow:0 6px 0 #e7cdb1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:24px;position:relative}
.node:nth-child(4n+2){transform:translateX(60px)}.node:nth-child(4n+4){transform:translateX(-60px)}
.node.open{background:var(--orange);color:#fff;box-shadow:0 6px 0 var(--orange-d);animation:pulse 1.6s ease-in-out infinite}
.node.done{background:var(--green);color:#fff;box-shadow:0 6px 0 #1f9658}
.node.lock{opacity:.5}
.node small{font-size:11px;letter-spacing:-1px}
.node .lbl{position:absolute;top:92px;width:150px;text-align:center;font-size:13px;color:var(--ink);line-height:1.5}
@keyframes pulse{50%{box-shadow:0 6px 0 var(--orange-d),0 0 0 10px rgba(255,138,61,.25)}}
/* lesson */
.prog{height:12px;background:#f3e6d8;border-radius:999px;overflow:hidden;flex:1}.prog i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.lesson{flex:1;display:flex;flex-direction:column;justify-content:center}
.tapnext{margin-top:auto;padding-top:14px;display:flex;gap:10px}
.tapnext .sub{width:auto;flex:0 0 64px;font-size:22px}
/* quiz */
.qcard{background:#fff;border-radius:24px;padding:20px;font-size:20px;line-height:2.1;box-shadow:var(--shadow);margin:6px 0 16px;min-height:150px}
.qno{font-size:14px;color:var(--muted);font-weight:800}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ox button{height:120px;border-radius:26px;font-size:64px;font-weight:800;color:#fff}
.ox .o{background:var(--blue);box-shadow:0 7px 0 #2c84d8}.ox .x{background:var(--red);box-shadow:0 7px 0 #d23c41}
.ox button:active{transform:translateY(4px)}
.fb{border-radius:22px;padding:14px 16px;margin-top:6px;font-size:17px;line-height:2}
.fb.ok{background:#dcf7e8;border:3px solid var(--green)}.fb.ng{background:#ffe3e3;border:3px solid var(--red);animation:shake .4s}
.fb h3{margin:0 0 4px;font-size:22px}
.combo{font-weight:800;color:var(--pink);text-align:center;font-size:18px;min-height:26px}
/* result */
.stars{font-size:58px;text-align:center;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;animation:pop .4s both}.stars span:nth-child(2){animation-delay:.2s}.stars span:nth-child(3){animation-delay:.4s}
.stars .off{filter:grayscale(1);opacity:.3}
.earn{text-align:center;font-size:20px;font-weight:800;margin:6px 0 14px}
.newwords{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 18px}
.newwords button{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:var(--shadow);font-weight:800;font-size:16px;line-height:1.9;animation:pop .4s both}
/* zukan */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:20px}
.card{background:#fff;border-radius:18px;padding:14px 8px;box-shadow:var(--shadow);text-align:center;font-weight:800;font-size:17px;line-height:1.9;min-height:92px;display:flex;align-items:center;justify-content:center}
.card.lock{background:#f3e6d8;color:#c9b29c;font-size:30px;box-shadow:none}
/* sheet */
.shade{position:fixed;inset:0;background:rgba(59,42,31,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease-out;max-height:85dvh;overflow:auto}
.sheet h2{margin:0;font-size:30px;line-height:2.2}
.sheet .yomi{color:var(--muted);font-size:15px}
.sheet .mean{font-size:18px;line-height:2.05;margin:10px 0}
.sheet .tatoe{background:#fff3c4;border-radius:16px;padding:12px 14px;font-size:17px;line-height:2}
.sheet .row{display:flex;gap:10px;margin-top:16px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.5}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.field{display:block;width:100%;font:inherit;font-size:22px;padding:14px;border-radius:16px;border:3px solid var(--line);margin:10px 0 18px;text-align:center}
.set{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px;font-size:17px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:10px}
.set input[type=range]{width:55%}.set input[type=checkbox]{width:26px;height:26px}
.muted{color:var(--muted);font-size:14px;line-height:1.8}
.me{display:flex;gap:12px;align-items:center;width:100%;background:#fff;border-radius:22px;padding:10px 14px;box-shadow:var(--shadow);margin:0 0 16px;text-align:left}
.mefig{width:96px;height:150px;flex-shrink:0;border-radius:16px;overflow:hidden}.mefig svg,.growstage svg,.closet-fig svg{width:100%;height:100%;display:block}
.mecopy{display:flex;flex-direction:column;gap:2px;align-items:flex-start}.mecopy b{font-size:20px}.mecopy small{font-size:13px;color:var(--muted);line-height:1.9}
.stg{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800}
.chara svg{width:100%;height:100%;border-radius:50%;background:#fff;box-shadow:var(--shadow)}
.chara[data-who] svg{border-radius:0;background:none;box-shadow:none}
.growstage{width:230px;height:368px;margin:4px auto;border-radius:24px;overflow:hidden;animation:pop .5s}
.closet-top{display:flex;gap:12px;align-items:stretch}.closet-fig{width:58%;aspect-ratio:200/320;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.closet-side{flex:1;display:flex;flex-direction:column;gap:10px;align-items:stretch;justify-content:flex-start}.closet-side .stg{text-align:center}
.tryon{background:#fff;border-radius:16px;padding:10px;text-align:center;font-weight:800;box-shadow:var(--shadow);line-height:1.6}
.big:disabled{background:#d9cbbd;box-shadow:0 6px 0 #bfae9c}
.ctabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 10px;scrollbar-width:none}.ctabs button{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:#fff;box-shadow:var(--shadow);font-weight:800;font-size:15px}.ctabs .on{background:var(--pink);color:#fff;box-shadow:0 4px 0 #d1477f}
.shelf{display:grid;grid-template-columns:1fr 1fr;gap:10px}.it{background:#fff;border-radius:16px;padding:12px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;font-weight:800;font-size:15px}.it small{font-size:12px;color:var(--muted)}.it.on{outline:3px solid var(--pink)}.it.lock{opacity:.55}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 18px;font-weight:800;z-index:40;max-width:90%;text-align:center;line-height:2;animation:up .2s}
.toast rt{color:#fff}
.art{position:relative;width:100%;height:100%;overflow:hidden}.art>svg{position:absolute;inset:0;width:100%;height:100%}
.art.full img{position:absolute;left:50%;bottom:2%;height:95%;transform:translateX(-50%)}
.chara .art.bust{border-radius:50%;background:#fff;box-shadow:var(--shadow)}
.qrow{display:flex;gap:8px;align-items:flex-start}.qrow .chara{width:64px;height:64px;animation:none}.qrow .qcard{flex:1;min-width:0}

.art .fxs{position:absolute;transform:translate(-50%,-50%);pointer-events:none;height:auto!important;bottom:auto!important} /* not the character's full-height rule */
.art .fxs.float{animation:fxfloat 3s ease-in-out infinite}.art .fxs.rise{animation:fxrise 4s ease-in-out infinite}
.art .fxs.drift{animation:fxdrift 5s ease-in-out infinite}.art .fxs.spin{animation:fxspin 14s linear infinite}
.art .fxs.spinslow{animation:fxspin 40s linear infinite}.art .fxs.flutter{animation:fxflutter 1.6s ease-in-out infinite}
@keyframes fxfloat{50%{transform:translate(-50%,-56%)}}@keyframes fxrise{0%{transform:translate(-50%,-40%);opacity:.4}50%{opacity:1}100%{transform:translate(-50%,-62%);opacity:.4}}
@keyframes fxdrift{50%{transform:translate(-44%,-50%)}}@keyframes fxspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes fxflutter{50%{transform:translate(-50%,-50%) scaleX(.86)}}
.thumb.fxthumb{background:linear-gradient(135deg,#ffe0ec,#d9e4ff);display:flex;align-items:center;justify-content:center}.thumb.fxthumb img{max-width:92%;max-height:92%}
.art.full img.petl{position:absolute;top:auto;left:3%;bottom:1.5%;width:30%;height:auto!important;transform:none;animation:petbob 1.8s ease-in-out infinite;transform-origin:bottom center;filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
@keyframes petbob{50%{transform:translateY(-6%) scale(1.03)}}
@keyframes twinkle{50%{opacity:.35;transform:translateY(-8px) scale(1.15)}}
.gacha-btn{background:linear-gradient(135deg,#ff6fa5,#ffb547);color:#fff;border-radius:16px;padding:10px;font-weight:800;font-size:17px;box-shadow:0 5px 0 #d1477f;display:flex;flex-direction:column;align-items:center;line-height:1.3}.gacha-btn small{font-size:13px}
.gacha{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:10px}
.capsule{font-size:110px;line-height:1.2;filter:drop-shadow(0 8px 0 #f0d3b4)}.capsule.shake{animation:shake .25s 5}
.gfig{width:200px;height:320px;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);animation:pop .5s}
.rare{font-size:30px;color:#ffb300;font-weight:800;letter-spacing:4px}.rare.r3{color:#ff4f8b;text-shadow:0 0 12px #ffd23f}
.gname{margin:6px 0 0;font-size:26px;line-height:2}
.thumb{display:block;width:100%;height:120px;border-radius:12px;overflow:hidden;background:#fff7ec;margin-bottom:6px}.thumb svg{width:100%;height:100%}.thumb.emo{font-size:46px;line-height:120px;text-align:center}
.zu{background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow);margin:8px 0}.zu .lbl{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:0 12px;font-size:14px;line-height:1.9}
.zu h3{margin:8px 0;font-size:18px;line-height:2}.zu table{width:100%;border-collapse:separate;border-spacing:4px;font-size:15px;line-height:1.9}
.zu th{background:#fff1b8;border-radius:10px;padding:4px 6px;font-size:13px}.zu td{background:#fff7ec;border-radius:10px;padding:6px;text-align:center}.zu tr>td:first-child{font-weight:800;text-align:left}.zu .tw{overflow-x:auto}.zu .lbl rt{color:#fff}
.mk{font-size:28px;font-weight:800;line-height:1}.mk.ok{color:var(--green)}.mk.ng{color:var(--red)}
.mission{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;background:linear-gradient(135deg,#fff3c4,#ffe0ec);border:3px solid var(--yellow);border-radius:18px;padding:10px 14px;margin-bottom:14px;line-height:1.9}
.mission b{font-size:16px}.mission span{font-size:14px;flex:1 1 60%}.mission em{font-style:normal;font-weight:800;color:var(--orange-d)}.mission.done{border-color:var(--green);background:#e6f8ee}.mission.done em{color:var(--green)}
.gword{text-align:center;font-size:40px;font-weight:800;line-height:2.4;background:#fff;border-radius:24px;box-shadow:var(--shadow);margin:10px 0}
.gopts{display:flex;flex-direction:column;gap:12px}.gopts .sub{text-align:left;font-size:16px;line-height:2;font-weight:500}
.thumb.hairthumb{width:100%;height:130px;margin:0 auto 6px}
.pcode{font-size:26px;font-weight:800;letter-spacing:2px;text-align:center;background:#fff7ec;border-radius:12px;padding:8px;margin:8px 0;user-select:all}
.enemy{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#2b2350,#4a3a7a);border-radius:20px;padding:8px 14px;margin:4px 0 8px;color:#fff}
.enemy rt{color:#e6defc}.mon{width:84px;height:84px;flex-shrink:0;animation:bob 2s ease-in-out infinite}.mon svg{width:100%;height:100%}
.mon img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 3px rgba(255,255,255,.7)) drop-shadow(0 3px 2px rgba(0,0,0,.25))}.mon-img.hit{filter:brightness(1.6) drop-shadow(0 0 8px #fff)}.mon-img.down{filter:grayscale(.7) opacity(.8)}
.mon.hit{animation:shake .4s}.mon.attack{animation:lunge .5s}.mon.down{animation:none;transform:rotate(90deg) translateX(10px);opacity:.75;transition:.4s}
.einfo{flex:1;min-width:0}.einfo b{font-size:16px;line-height:2}.hp{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}
.hpbar{flex:1;height:14px;background:#1a1533;border-radius:999px;overflow:hidden;border:2px solid #fff}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff5a5f,#ffb547);transition:width .5s}
@keyframes lunge{40%{transform:translateY(14px) scale(1.15)}}
.bfx{position:fixed;inset:0;pointer-events:none;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.bfx .skill{font-size:28px;font-weight:800;color:#fff;text-align:center;line-height:2;padding:6px 18px;border-radius:18px;max-width:90%;animation:pop .35s;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.bfx .skill rt{color:#fff}.bfx.win .skill{background:linear-gradient(135deg,#ff6fa5,#ffb547)}.bfx.lose .skill{background:#7a3b8a}
.bfx .beam{position:fixed;left:-10%;top:24%;width:120%;height:26px;border-radius:999px;background:linear-gradient(90deg,transparent,#fff7a8,#ff8fd1,#8fe3ff,transparent);animation:beam .6s ease-out forwards;box-shadow:0 0 30px #ffd1f0}
@keyframes beam{0%{transform:scaleX(0);transform-origin:left;opacity:1}100%{transform:scaleX(1);opacity:0}}
.bfx .ko{font-size:44px;font-weight:800;color:#ffd23f;text-shadow:0 3px 0 #c97b00,0 0 20px #fff;animation:pop .5s .3s both}
.bfx.lose{background:rgba(255,40,60,.18);animation:fade .2s}
body.quake .app{animation:shake .4s}
.bres{display:flex;align-items:center;gap:12px;border-radius:20px;padding:10px 14px;margin:6px 0 10px;line-height:1.9}.bres.win{background:#fff3c4;border:3px solid var(--yellow)}.bres.lose{background:#f1ecff;border:3px solid #c3b8f0}
.bres .mon.small{width:64px;height:64px;animation:none}.bres b{display:block;font-size:17px}.bres span{display:block;font-size:14px}.bres .drop{color:#d1477f;font-weight:800}

.buddycard .bar{height:10px;border-radius:999px;background:#f3e6d8;overflow:hidden;margin:4px 0}.buddycard .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb3cf,#ff6fa5)}.buddycard small{font-size:12px;color:var(--muted)}

<body>
<div class="app" id="app"></div>
<script src="avatar.js"></script>
<script src="decor.js"></script>
<script src="battle.js"></script>
<script src="office.js"></script>
<script src="voice.js"></script>
<script>
'use strict';
// ---------- data & progress ----------
let C=null; // course.json
const KEY='tk_v1';
const S=Object.assign({name:'',coins:0,xp:0,stars:{},best:{},words:{},streak:{last:'',days:0},rate:0.95,furi:true,look:{...DEFAULT_LOOK},owned:[...ITEMS,...ART].filter(i=>!i.p).map(i=>i.id),seenStage:0},load());
// 2026-10-05 下田さん「つぎへを押したら自動で読んでほしい」→ 自動よみあげを最初からON（設定でOFFにできる）
if(!S.autoReadV2){S.autoRead=true;S.autoReadV2=1;save()}
const myStage=()=>stageOf(level());

// ---------- parent view: send a study summary to the cloud (read with the parent code) ----------
const SUPA='https://aevqdsozxiklyjfavvhf.supabase.co/rest/v1/rpc/',SKEY='sb_publishable_3J-KuCCmuO_d7WLzQrsrTg_U3QiaF_I';
function rnd(n,abc){const a=new Uint32Array(n);crypto.getRandomValues(a);return [...a].map(v=>abc[v%abc.length]).join('')}
if(!S.key)S.key=rnd(32,'abcdefghijkmnopqrstuvwxyz23456789');
if(!S.pcode)S.pcode=rnd(10,'ABCDEFGHJKLMNPQRSTUVWXYZ23456789');  // no 0/O, 1/I: easy to type
S.log=S.log||[];S.time=S.time||{};save();
// ---------- buddy puppy & rank ----------
S.buddy=Object.assign({xp:0,name:'ココ',hintDay:'',hints:0},S.buddy||{});
const BUDDY_STEPS=[0,150,500],HINTS_PER_DAY=3;
const buddyStage=()=>BUDDY_STEPS.filter(v=>S.buddy.xp>=v).length-1;
const buddyImg=(cls='')=>`<img class="buddy ${cls}" src="art/buddy/b${buddyStage()}.png" alt="${esc(S.buddy.name)}">`;
const hintsLeft=()=>S.buddy.hintDay===today()?Math.max(0,HINTS_PER_DAY-S.buddy.hints):HINTS_PER_DAY;
const RANKS=[[0,'みならい<ruby>案内人<rt>あんないにん</rt></ruby>'],[300,'ルーキー<ruby>営業<rt>えいぎょう</rt></ruby>'],[1000,'エース<ruby>相談役<rt>そうだんやく</rt></ruby>'],[2500,'カリスマ<ruby>宅建士<rt>たっけんし</rt></ruby>'],[5000,'<ruby>伝説<rt>でんせつ</rt></ruby>の<ruby>不動産王<rt>ふどうさんおう</rt></ruby>']];
const rankIdx=()=>RANKS.filter(r=>S.xp>=r[0]).length-1;
const rankName=()=>RANKS[rankIdx()][1];
const pcodeShow=()=>S.pcode.replace(/(.{4})(.{4})(.{2})/,'$1-$2-$3');
function logStudy(e){S.log.push({t:Date.now(),...e});if(S.log.length>300)S.log=S.log.slice(-300);save();syncSoon()}
// study time: count only while the app is on screen
setInterval(()=>{if(document.visibilityState==='visible'&&C){const d=today();S.time[d]=(S.time[d]||0)+20;save()}},20000);
let syncTimer=null;
function syncSoon(){clearTimeout(syncTimer);syncTimer=setTimeout(sync,1500)}
async function sync(){
 if(!C)return;
 const ls=lessons(),days=Object.keys(S.time).sort().slice(-60);
 const data={v:1,name:S.name,level:level(),stage:STAGES[myStage()].name,xp:S.xp,coins:S.coins,stars:S.stars,
  words:Object.keys(S.words).length,wordsTotal:Object.keys(C.words).length,streak:S.streak,mission:S.mission||'',
  lessonsDone:ls.filter(l=>S.stars[l.id]!==undefined).length,lessonsTotal:ls.length,next:nextLesson().id,
  missNow:Object.values(S.miss||{}).map(q=>q.q).slice(0,30),papa:S.papaRes||null,log:S.log.slice(-200),time:Object.fromEntries(days.map(d=>[d,S.time[d]])),sentAt:new Date().toISOString()};
 try{await fetch(SUPA+'takken_save',{method:'POST',headers:{apikey:SKEY,'Content-Type':'application/json'},body:JSON.stringify({p_key:S.key,p_code:S.pcode,p_data:data}),keepalive:true})}catch{}
 try{const r=await fetch(SUPA+'takken_challenge_get',{method:'POST',headers:{apikey:SKEY,'Content-Type':'application/json'},body:JSON.stringify({p_key:S.key})});const ch=r.ok?await r.json():undefined;
  if(ch!==undefined&&JSON.stringify(ch)!==JSON.stringify(S.papa||null)){const fresh=ch&&ch.id!==S.papa?.id&&ch.id!==S.papaRes?.id;S.papa=ch;save();if(fresh&&app.querySelector('.stats')&&!Q?.papa)toast('📜 パパから<ruby>挑戦状<rt>ちょうせんじょう</rt></ruby>がとどいた！')}}catch{}
}
setInterval(()=>{if(document.visibilityState==='visible')sync()},120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')sync()});
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}}
const today=()=>new Date().toLocaleDateString('sv-SE');
const lessons=()=>C.chapters.flatMap(c=>c.lessons.map(l=>({...l,ch:c})));
const level=()=>Math.floor(S.xp/100)+1;
const isOpen=id=>{const ls=lessons(),i=ls.findIndex(l=>l.id===id);return i===0||S.stars[ls[i-1].id]!==undefined};
const nextLesson=()=>lessons().find(l=>S.stars[l.id]===undefined)||lessons()[0];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

// ---------- characters (placeholder SVG until the ChatGPT art is in chara/) ----------
const NAMES={neko:'コッカー先生',get mirai(){return S.name||'あなた'}};
function face(who,f){
 const mouth={normal:'M42 70 Q50 76 58 70',happy:'M38 66 Q50 84 62 66 Z',surprise:'M50 66 m-6 0 a6 7 0 1 0 12 0 a6 7 0 1 0 -12 0',think:'M42 72 L58 70',sad:'M40 76 Q50 66 60 76'}[f]||'';
 const eyes=f==='happy'?'<path d="M30 50 Q36 43 42 50 M58 50 Q64 43 70 50" stroke="#3b2a1f" stroke-width="4" fill="none" stroke-linecap="round"/>':f==='surprise'?'<circle cx="36" cy="50" r="7" fill="#3b2a1f"/><circle cx="64" cy="50" r="7" fill="#3b2a1f"/>':'<circle cx="36" cy="50" r="5" fill="#3b2a1f"/><circle cx="64" cy="50" r="5" fill="#3b2a1f"/><circle cx="38" cy="48" r="1.6" fill="#fff"/><circle cx="66" cy="48" r="1.6" fill="#fff"/>';
 const m=`<path d="${mouth}" stroke="#3b2a1f" stroke-width="3.5" fill="${f==='happy'?'#ff8fa3':'none'}" stroke-linecap="round"/>`;
 if(who==='neko')return `<svg viewBox="0 0 100 100"><path d="M18 40 L22 8 L44 28 Z M82 40 L78 8 L56 28 Z" fill="#ffa95c"/><circle cx="50" cy="56" r="38" fill="#ffb877"/><path d="M20 30 L24 14 L36 26Z M80 30 L76 14 L64 26Z" fill="#ffd6e0"/>${eyes}<circle cx="36" cy="50" r="12" fill="none" stroke="#5b4636" stroke-width="3"/><circle cx="64" cy="50" r="12" fill="none" stroke="#5b4636" stroke-width="3"/><path d="M48 50 L52 50" stroke="#5b4636" stroke-width="3"/><path d="M47 60 L53 60 L50 64Z" fill="#ff6f91"/>${m}<path d="M14 60 L30 62 M14 68 L30 66 M86 60 L70 62 M86 68 L70 66" stroke="#c97a3d" stroke-width="2"/></svg>`;
 return `<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="40" fill="#5b3a29"/><circle cx="50" cy="58" r="32" fill="#ffe2c9"/><path d="M18 52 Q20 18 50 16 Q80 18 82 52 Q70 30 50 34 Q30 30 18 52Z" fill="#6b4431"/><circle cx="78" cy="30" r="8" fill="#ff6fa5"/><circle cx="30" cy="66" r="6" fill="#ffb3c7" opacity=".7"/><circle cx="70" cy="66" r="6" fill="#ffb3c7" opacity=".7"/>${eyes}${m}</svg>`;
}
// ChatGPT art goes in chara/<who>_<face>.png; until a file exists the SVG above is shown.
function chara(who,f='normal',pop=false){if(who==='neko')return `<span class="chara${pop?' pop':''}"><div class="art bust"><img src="art/sensei_${['normal','happy','surprise','think','sad'].includes(f)?f:'normal'}.jpg" alt="${NAMES.neko}" style="width:100%;height:100%;object-fit:cover"></div></span>`;if(who==='mirai')return `<span class="chara${pop?' pop':''}">${avatarHTML(S.look,myStage(),f,'bust')}</span>`;return `<span class="chara${pop?' pop':''}" data-who="${who}"><img src="chara/${who}_${f}.png" alt="${NAMES[who]}" style="width:100%;height:100%;object-fit:contain" onerror="this.outerHTML=face('${who}','${f}')"></span>`}
function say(who,f,html,pop){return `<div class="stage${who==='mirai'?' right':''}">${chara(who,f,pop)}<div class="bubble"><span class="name">${NAMES[who]}</span>${html}</div></div>`}

// ---------- speech ----------
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));voice=v.find(v=>/Google|Kyoko|Nanami|Haruka/i.test(v.name))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
// The voice reads the furigana shown on screen, so it can never say a reading different from what she sees.
function plain(html){const d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('.name').forEach(n=>n.remove());d.querySelectorAll('ruby').forEach(r=>{const rt=r.querySelector('rt');r.replaceWith(rt?rt.textContent:r.textContent)});return d.textContent}
// Recorded clips (voice.js) play in order; a part without a clip uses the phone's speech engine.
let VOICES=new Set(),vAudio=null,vRun=0;
fetch('data/voice.json',{cache:'no-cache'}).then(r=>r.json()).then(k=>VOICES=new Set(k)).catch(()=>{});
function hush(){vRun++;if(vAudio){vAudio.pause();vAudio=null}speechSynthesis?.cancel?.()}
function ttsPart(html,who){return new Promise(res=>{if(!('speechSynthesis' in window))return res();const u=new SpeechSynthesisUtterance(plain(html));u.lang='ja-JP';u.rate=S.rate;u.pitch=who==='girl'?1.3:.9;if(voice)u.voice=voice;u.onend=u.onerror=res;speechSynthesis.speak(u)})}
function clipPart(key){return new Promise(res=>{const a=new Audio(`voice/${key}.m4a`);a.playbackRate=S.rate/.95;a.onended=()=>res(true);a.onerror=()=>res(false);vAudio=a;a.play().catch(()=>res(false))})}
async function speakParts(parts){
 hush();const run=vRun;
 for(const [who,html] of parts){
  if(run!==vRun)return;
  const k=voiceKey(who,html);
  if(!(VOICES.has(k)&&await clipPart(k))&&run===vRun)await ttsPart(html,who);
 }
}
function speak(html,who='teacher'){speakParts([[who,html]])}
let curPanel=null;
const speakPanel=()=>curPanel&&speakParts(panelParts(curPanel));

// ---------- streak / rewards ----------
function touchStreak(){const t=today(),y=new Date(Date.now()-864e5).toLocaleDateString('sv-SE');if(S.streak.last===t)return;S.streak.days=S.streak.last===y?S.streak.days+1:1;S.streak.last=t;save()}
function confetti(){const c=document.createElement('div');c.className='confetti';const col=['#ff8a3d','#ffd23f','#ff6fa5','#4aa8ff','#2fbf71'];for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=col[i%5];e.style.animationDelay=Math.random()*.6+'s';e.style.animationDuration=1.4+Math.random()*1.2+'s';c.appendChild(e)}document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}

// ---------- word sheet ----------
let CHO={};fetch('data/cho.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>CHO=d).catch(()=>{});
const cho=t=>CHO[t]?CHO[t].replace(/\{name\}/g,esc(S.name||'きみ')):'';
function wordSheet(t){
 const w=C.words[t];if(!w)return;hush();
 // meeting a word counts as collecting it
 if(!S.words[t]){S.words[t]=1;save();setTimeout(()=>toast(`📖 じてんに<ruby>登録<rt>とうろく</rt></ruby>！（${jitenPct()}%）`),300)}
 const sh=document.createElement('div');sh.className='shade';
 sh.innerHTML=`<div class="sheet" role="dialog" aria-label="${esc(t)}"><h2><ruby>${esc(t)}<rt>${esc(w.yomi)}</rt></ruby></h2>${cho(t)?`<div class="cho"><b>ひとことで<ruby>言<rt>い</rt></ruby>うと</b>${cho(t)}</div>`:''}<div class="mean">${w.meanHtml}</div><div class="tatoe">💡 たとえば…<br>${w.tatoeHtml}</div><div class="row"><button class="sub" data-say>🔊 よむ</button><button class="big" data-close style="font-size:18px;padding:14px">わかった！</button></div></div>`;
 sh.addEventListener('click',e=>{if(e.target===sh||e.target.closest('[data-close]'))sh.remove();if(e.target.closest('[data-say]'))speakParts(wordParts(w,cho(t)))});
 document.body.appendChild(sh);
}
document.addEventListener('click',e=>{const b=e.target.closest('.w');if(b){e.stopPropagation();wordSheet(b.dataset.w)}});

// ---------- 合格メーター ----------
// 本番50問の分野ごとの問題数に、その分野のクイズの正かい率をかけて「いま本番を受けたら何点くらいか」を出す。
// まだやっていないレッスンは0点あつかい。○×のクイズなので本番より甘めに出る点は、合格ラインを高め(36点)にしてカバー。
const EXAM_DATE='2027-10-17',PASS=36;
const FIELDS=[
 {name:'<ruby>宅建業法<rt>たっけんぎょうほう</rt></ruby>',q:20,from:1,to:10,color:'#ff8a3d'},
 {name:'<ruby>法令<rt>ほうれい</rt></ruby>の<ruby>制限<rt>せいげん</rt></ruby>',q:8,from:11,to:14,color:'#2fa59a'},
 {name:'<ruby>権利関係<rt>けんりかんけい</rt></ruby>',q:14,from:15,to:20,color:'#5b7fd6'},
 {name:'<ruby>税<rt>ぜい</rt></ruby>・その<ruby>他<rt>た</rt></ruby>',q:8,from:21,to:23,color:'#d98c2b'}];
const chNo=c=>parseInt(String(c.id).replace(/\D/g,''),10);
const lessonAcc=id=>S.acc?.[id]??({3:1,2:.8,1:.6}[S.stars[id]]??0);
function meter(){
 const fs=FIELDS.map(f=>{const ls=C.chapters.filter(c=>chNo(c)>=f.from&&chNo(c)<=f.to).flatMap(c=>c.lessons);
  const m=ls.length?ls.reduce((a,l)=>a+lessonAcc(l.id),0)/ls.length:0;
  return {...f,ls,done:ls.filter(l=>S.stars[l.id]!==undefined).length,score:f.q*m}});
 const total=fs.reduce((a,f)=>a+f.score,0),days=Math.max(0,Math.ceil((new Date(EXAM_DATE+'T00:00:00')-new Date())/864e5));
 return {fs,total:Math.round(total),days};
}
function meterCard(){
 const M=meter(),left=Math.max(0,PASS-M.total);

 <div class="gauge"><i style="width:${M.total/50*100}%"></i><em style="left:${PASS/50*100}%"><ruby>合格<rt>ごうかく</rt></ruby>ライン${PASS}<ruby>点<rt>てん</rt></ruby></em></div>
 <div class="mscore">いまの<ruby>実力<rt>じつりょく</rt></ruby> <b>${M.total}</b> / 50<ruby>点<rt>てん</rt></ruby>　${left?`<ruby>合格<rt>ごうかく</rt></ruby>まであと<b style="font-size:18px">${left}</b><ruby>点<rt>てん</rt></ruby>！`:'🎉 <ruby>合格<rt>ごうかく</rt></ruby>ライン<ruby>突破<rt>とっぱ</rt></ruby>！'}</div>

 ${M.fs.map(f=>{const nx=f.ls.find(l=>S.stars[l.id]===undefined);return `<div class="goalf" style="border-left:6px solid ${f.color}"><h3>${f.name}　<small class="muted"><ruby>本番<rt>ほんばん</rt></ruby>${f.q}<ruby>問<rt>もん</rt></ruby></small></h3>
  <div>いまの<ruby>点<rt>てん</rt></ruby> <b>${Math.round(f.score*10)/10}</b> / ${f.q}　・　レッスン ${f.done} / ${f.ls.length} クリア</div>
  ${nx?`<div class="muted" style="margin-top:4px">つぎ：「${nx.titleHtml}」</div>`:'<div style="margin-top:4px">✅ ぜんぶクリア！まちがいは「ふくしゅう」で<ruby>直<rt>なお</rt></ruby>そう</div>'}</div>`}).join('')}

 <button class="big" onclick="go(home)">ホームへ</button>`;
}

const BONUS=30,MISSION=50;
function missionDone(){return S.mission===today()}
function completeMission(){if(missionDone())return false;S.mission=today();S.coins+=MISSION;save();return true}
function home(){
 if(!S.name)return welcome();
 let bonus=false;if(S.bonusDay!==today()){S.bonusDay=today();S.coins+=BONUS;save();bonus=true}

 ${meterCard()}
 <div class="lvl"><b>レベル ${lv}</b> <span class="muted">あと${100-S.xp%100}ポイントでレベルアップ</span><div class="bar"><i style="width:${S.xp%100}%"></i></div></div>
 <button class="me" onclick="go(closet)"><span class="mefig">${avatarHTML(S.look,myStage(),done?'happy':'normal','full')}</span><span class="mecopy"><b>${esc(S.name)}</b><span class="stg">${STAGES[myStage()].name}</span><span class="rank"><img class="rbadge" src="art/rank/r${rankIdx()}.png" alt="">${rankName()}</span>${myStage()<STAGES.length-1?`<small>レベル${STAGES[myStage()+1].from}で${STAGES[myStage()+1].name}に<ruby>成長<rt>せいちょう</rt></ruby>！</small>`:'<small>さいこうの<ruby>成長<rt>せいちょう</rt></ruby>だんかい！</small>'}<span class="pill" style="margin-top:8px">👗 きせかえ</span></span></button>
 <div class="buddycard">${buddyImg()}<div><b>あいぼう：${esc(S.buddy.name)}</b><span>${['こいぬ','リボンのこいぬ','おうかんのこいぬ'][buddyStage()]}</span>${buddyStage()<2?`<div class="bar"><i style="width:${Math.min(100,(S.buddy.xp-BUDDY_STEPS[buddyStage()])/(BUDDY_STEPS[buddyStage()+1]-BUDDY_STEPS[buddyStage()])*100)}%"></i></div><small><ruby>正解<rt>せいかい</rt></ruby>するとなかよし<ruby>度<rt>ど</rt></ruby>アップ</small>`:'<small>さいこうに<ruby>仲<rt>なか</rt></ruby>よし！</small>'}</div></div>
 ${papaOpen()?`<button class="papacard" onclick="go(papaBattle)"><span class="pc-ic">📜</span><span><b>パパからの<ruby>挑戦状<rt>ちょうせんじょう</rt></ruby>がとどいた！</b>${S.papa.msg?`<i>「${esc(S.papa.msg)}」</i>`:''}<small>${S.papa.qs.length}<ruby>問<rt>もん</rt></ruby>のボス<ruby>戦<rt>せん</rt></ruby>・かつと 🪙+100＆プレゼント</small></span></button>`:''}
 <div class="mission ${missionDone()?'done':''}"><b>🎯 <ruby>今日<rt>きょう</rt></ruby>のミッション</b><span>レッスン・ふくしゅう・ことばゲームのどれかを1<ruby>回<rt>かい</rt></ruby>クリア</span><em>${missionDone()?'✅ クリア！':`🪙 +${MISSION}`}</em></div>
 <button class="big" onclick="go(lesson,'${nx.id}')">▶ 「${nx.titleHtml}」をはじめる</button>
 <button class="tile otile" onclick="go(office)"><img src="art/office/sign.png" alt=""><span><b>${officeName()}</b><small>${officeBuff()?`✨ クイズのコイン +${officeBuff()}%`:'<ruby>家具<rt>かぐ</rt></ruby>をおいて<ruby>自分<rt>じぶん</rt></ruby>のお<ruby>店<rt>みせ</rt></ruby>をつくろう'}</small></span></button>

function map(){
 let h=header('ステージ','go(home)');
 for(const c of C.chapters){
  h+=`<div class="chap" style="background:${c.color}"><h2>${c.titleHtml}</h2><p>${c.subtitleHtml}</p></div><div class="path">`;
  c.lessons.forEach((l,i)=>{const st=S.stars[l.id],open=isOpen(l.id);h+=`<button class="node ${st!==undefined?'done':open?'open':'lock'}" ${open?`onclick="go(lesson,'${l.id}')"`:'disabled'} aria-label="${esc(l.title)}">${st!==undefined?'★'.repeat(st)||'✓':open?i+1:'🔒'}<span class="lbl">${l.titleHtml}</span></button>`});
  h+='</div><div style="height:30px"></div>';
 }
 app.innerHTML=h;
 // 章が増えて地図が長くなったので、いまやるステージまで自動でスクロール
 const cur=document.querySelector('.node.open');if(cur)cur.scrollIntoView({block:'center'});
}

function lesson(id,idx=0){
 const l=lessons().find(l=>l.id===id),p=l.panels[idx],last=idx===l.panels.length-1;
 const body=p.who==='zu'?zuCard(p):p.who==='point'?`<div class="point"><b class="lbl">ここがポイント！</b><br>${p.html}</div>${chara('neko','happy',true)}`:say(p.who,p.face||'normal',p.html,true);
 app.innerHTML=`<div class="top"><button class="back" onclick="go(home)" aria-label="やめる">×</button><div class="prog"><i style="width:${(idx+1)/l.panels.length*100}%"></i></div><button class="back" onclick="speakPanel()" aria-label="よみあげ">🔊</button></div>
 <div class="muted" style="text-align:center">${l.titleHtml}</div><div class="lesson">${body}</div>
 <p class="muted" style="text-align:center">きいろの<ruby>言葉<rt>ことば</rt></ruby>をタップすると<ruby>意味<rt>いみ</rt></ruby>が出るよ</p>
 <div class="tapnext">${idx>0?`<button class="sub" onclick="go(lesson,'${id}',${idx-1})" aria-label="まえへ">‹</button>`:''}<button class="big ${last?'green':''}" onclick="${last?`go(quiz,'${id}')`:`go(lesson,'${id}',${idx+1})`}">${last?'クイズにちょうせん！':'つぎへ ›'}</button></div>`;
 curPanel=p;if(S.autoRead)speakPanel();
}

// 図で見るまとめ: ○ and × become big coloured marks so the pattern is visible at a glance.
function zuCard(p){
 const cell=h=>h==='○'?'<span class="mk ok">○</span>':h==='×'?'<span class="mk ng">×</span>':h;
 return `<div class="zu"><b class="lbl">📊 <ruby>図<rt>ず</rt></ruby>で<ruby>見<rt>み</rt></ruby>てみよう</b><h3>${p.titleHtml}</h3><div class="tw"><table>${p.tableHtml.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${c}</th>`:`<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</table></div></div>${chara('neko','happy',true)}`;
}

let Q=null;
function quiz(id,items,title){
 const l=id&&lessons().find(l=>l.id===id);
 Q={id,list:items||l.quiz.map(q=>({...q,from:id})),i:0,ok:0,combo:0,miss:[],title:title||l.titleHtml};
 Q.mon=monsterFor(id||'review');Q.bStage=buddyStage();Q.rank=rankIdx();Q.hinted=false;Q.need=Math.max(1,Q.list.length-1);Q.hits=0;
 qShow();
}
function qShow(){
 const q=Q.list[Q.i];
 app.innerHTML=`<div class="top"><button class="back" onclick="go(home)" aria-label="やめる">×</button><div class="prog"><i style="width:${Q.i/Q.list.length*100}%"></i></div><button class="back" onclick="speak(Q.list[Q.i].qHtml)" aria-label="よみあげ">🔊</button></div>
 <div class="enemy" id="enemy">${enemyCard('normal')}</div>
 <div class="qno">もんだい ${Q.i+1} / ${Q.list.length}　<span class="muted">${Q.title}</span></div><div class="qrow">${chara('mirai','think')}<div class="qcard">${q.qHtml}</div></div>
 <div class="combo">${Q.combo>=2?`🔥 ${Q.combo}れんぞく せいかい！`:''}</div>
 <div id="hint"><button class="hintbtn" onclick="wanHint()" ${hintsLeft()?'':'disabled'}>${buddyImg('mini')}<span>ワンワンヒント<small>きょう あと${hintsLeft()}<ruby>回<rt>かい</rt></ruby></small></span></button></div>
 <div id="ans"><div class="ox"><button class="o" onclick="qAnswer(true)" aria-label="まる">○</button><button class="x" onclick="qAnswer(false)" aria-label="ばつ">×</button></div></div>`;
 if(S.autoRead)speak(q.qHtml);
}
function qAnswer(v){
 const q=Q.list[Q.i],ok=v===q.a;
 if(ok){Q.ok++;Q.combo++;Q.hits++;S.buddy.xp+=Q.combo>=3?5:3}else{Q.combo=0;Q.miss.push(q)}
 battleFx(ok);
 $('#ans').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><div class="stage">${chara('mirai',ok?'happy':'sad',true)}<div><h3>${ok?'せいかい！':'ざんねん…'}</h3><div>こたえは <b style="font-size:24px">${q.a?'○':'×'}</b></div></div></div><div>${q.whyHtml}</div></div><div style="height:14px"></div><button class="big ${ok?'green':'blue'}" onclick="qNext()">${Q.i+1<Q.list.length?'つぎのもんだい ›':'けっかを見る'}</button>`;
 if(!ok||S.autoRead)speak(q.whyHtml);
}
// ---------- battle ----------
function enemyCard(mood){
 const m=Q.mon,left=Math.max(0,Q.need-Q.hits);
 return `<div class="mon ${mood}">${monsterSVG(m,mood)}</div><div class="einfo"><b>${bruby(m.name)}</b><div class="hp"><span>HP</span><div class="hpbar"><i style="width:${left/Q.need*100}%"></i></div></div></div>`;
}
function battleFx(ok){
 const m=Q.mon,down=Q.hits>=Q.need;
 $('#enemy').innerHTML=enemyCard(ok?(down?'down':'hit'):'attack');
 const fx=document.createElement('div');fx.className='bfx '+(ok?'win':'lose');
 fx.innerHTML=ok?`<div class="beam"></div><div class="skill">${bruby(m.sk[(Q.hits-1)%m.sk.length])}！</div>${down?'<div class="ko">やっつけた！</div>':''}`
  :`<div class="skill">${bruby(m.name)}のこうげき！</div>`;
 document.body.appendChild(fx);if(!ok)document.body.classList.add('quake');
 setTimeout(()=>{fx.remove();document.body.classList.remove('quake')},1500);
}
function battleEnd(){
 // Defeat = bonus coins and sometimes a free item from the gacha pool. Losing never takes anything away.
 const m=Q.mon,win=Q.hits>=Q.need;let bonus=0,drop=null;
 if(Q.papa)S.papaRes={id:Q.papa,win,ok:Q.ok,n:Q.list.length,at:new Date().toISOString()};
 if(win){bonus=Q.papa?100:30;const pool=gachaPool();if(pool.length&&(Q.papa||Math.random()<.4)){drop=pool[Math.floor(Math.random()*pool.length)];S.owned.push(drop.id)}S.coins+=bonus;S.defeated=S.defeated||{};S.defeated[m.id]=(S.defeated[m.id]||0)+1;save()}
 return `<div class="bres ${win?'win':'lose'}"><div class="mon small">${monsterSVG(m,win?'down':'normal')}</div><div><b>${win?`${bruby(m.name)}をやっつけた！`:`${bruby(m.name)}に、にげられた…`}</b><span>${win?`ボーナス 🪙 +${bonus}`:'もう1<ruby>回<rt>かい</rt></ruby>ちょうせんして、やっつけよう！'}</span>${drop?`<span class="drop">🎁 ドロップ：${drop.name}</span>`:''}</div></div>`;
}

// The buddy shows the lesson's key point (not the answer): ○× has no wrong choices to remove.
function wanHint(){
 if(!hintsLeft())return;
 const q=Q.list[Q.i],l=lessons().find(l=>l.id===(q.from||Q.id));
 const pt=l&&(l.panels.find(p=>p.who==='point')||l.panels.find(p=>p.html));
 if(S.buddy.hintDay!==today()){S.buddy.hintDay=today();S.buddy.hints=0}
 S.buddy.hints++;save();
 $('#hint').innerHTML=`<div class="hintbox">${buddyImg('mini')}<div><b>${esc(S.buddy.name)}「ここがポイントだワン！」</b><div>${pt?pt.html:'レッスンを<ruby>思<rt>おも</rt></ruby>い<ruby>出<rt>だ</rt></ruby>してみてワン！'}</div></div></div>`;
}

// ---------- パパからの挑戦状 ----------
const papaOpen=()=>S.papa&&S.papa.qs?.length&&!(S.papaRes?.id===S.papa.id&&S.papaRes.win);
function papaBattle(){
 const items=S.papa.qs.map(({l,i})=>{const ls=lessons().find(x=>x.id===l);return ls&&ls.quiz[i]&&{...ls.quiz[i],from:l}}).filter(Boolean);
 if(!items.length)return go(home);
 quiz(null,items,'📜 パパからの<ruby>挑戦状<rt>ちょうせんじょう</rt></ruby>');
 Q.papa=S.papa.id;Q.mon={...MONSTERS.papa,id:'papa'};qShow();
}

function qNext(){Q.i++;if(Q.i<Q.list.length)return qShow();result()}

function result(){
 const before=myStage();
 const n=Q.list.length,ok=Q.ok,star=ok===n?3:ok>=n-1?2:ok>=n-2?1:0,coins=ok*10+(star===3?20:0);
 const obonus=officeBonus(coins);S.coins+=coins+obonus;S.xp+=ok*10;touchStreak();
 // Missed questions go to review; a correct answer in review removes them.
 S.miss=S.miss||{};for(const q of Q.miss)S.miss[q.qHtml]={...q};for(const q of Q.list)if(!Q.miss.includes(q))delete S.miss[q.qHtml];
 let fresh=[];
 if(Q.id){S.acc=S.acc||{};S.acc[Q.id]=Math.max(S.acc[Q.id]??0,ok/n)}
 if(Q.id){const l=lessons().find(l=>l.id===Q.id);if(star>0){S.stars[Q.id]=Math.max(S.stars[Q.id]??0,star);fresh=l.words.filter(w=>!S.words[w]);fresh.forEach(w=>S.words[w]=1)}}
 save();
 logStudy({k:Q.id?'lesson':'review',id:Q.id||'',ok,n,miss:Q.miss.map(q=>q.q)});
 const battle=battleEnd();
 const msg=star===3?'ぜんもんせいかい！てんさいだワン！':star>0?'クリア！よくがんばったワン！':'おしい！もう1回やってみようワン！';
 app.innerHTML=`${header('けっか')}${battle}${say('neko',star?'happy':'think',msg,true)}<div class="stars">${[0,1,2].map(i=>`<span class="${i<star?'':'off'}">⭐</span>`).join('')}</div>
 <div class="earn">${ok} / ${n} もんせいかい　🪙 +${coins}${obonus?`<small class="obon">🏢 オフィスボーナス +${obonus}</small>`:''}</div>
 ${fresh.length?`<div class="muted" style="text-align:center">あたらしい<ruby>言葉<rt>ことば</rt></ruby>カードをゲット！</div><div class="newwords">${fresh.map((w,i)=>`<button class="w" data-w="${esc(w)}" style="animation-delay:${i*.12}s"><ruby>${esc(w)}<rt>${esc(C.words[w].yomi)}</rt></ruby></button>`).join('')}</div>`:''}
 ${star===0&&Q.id?`<button class="big" onclick="go(quiz,'${Q.id}')">もう1回クイズ</button><div style="height:12px"></div><button class="sub" onclick="go(lesson,'${Q.id}')">レッスンを見なおす</button>`:`<button class="big" onclick="go(home)">ホームへ</button><div style="height:12px"></div><button class="sub" onclick="go(map)">ステージを見る</button>`}`;
 if(star>0){confetti();if(completeMission())setTimeout(()=>toast(`🎯 ミッションクリア！ 🪙 +${MISSION}`),1200)}
 if(myStage()>before)setTimeout(()=>grown(myStage()),900);
 if(buddyStage()>Q.bStage)setTimeout(()=>{confetti();toast(`🐶 ${esc(S.buddy.name)}がせいちょうした！`)},1600);
 if(rankIdx()>Q.rank)setTimeout(()=>{confetti();toast(`<img class="rbadge big" src="art/rank/r${rankIdx()}.png" alt=""><br>しょうごうアップ！「${rankName()}」`)},2300);
}

function review(){
 const items=Object.values(S.miss||{});
 if(!items.length){app.innerHTML=`${header('ふくしゅう','go(home)')}${say('neko','happy','まちがえた<ruby>問題<rt>もんだい</rt></ruby>はないよ！すごいワン！<br>レッスンでクイズをすると、まちがえた<ruby>問題<rt>もんだい</rt></ruby>がここにたまるよ。',true)}<button class="big" onclick="go(home)">ホームへ</button>`;return}
 quiz(null,items.sort(()=>Math.random()-.5).slice(0,10),'ふくしゅう');
}

let G=null;
function wordgame(){
 const mine=Object.keys(S.words);
 if(mine.length<3){app.innerHTML=`${header('ことばゲーム','go(home)')}${say('neko','normal','<ruby>言葉<rt>ことば</rt></ruby>カードが3まい<ruby>集<rt>あつ</rt></ruby>まると<ruby>遊<rt>あそ</rt></ruby>べるワン！まずはレッスンをクリアしよう！',true)}<button class="big" onclick="go(home)">ホームへ</button>`;return}
 const pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
 const all=Object.keys(C.words),rounds=shuffle(mine).slice(0,5);
 G={i:0,ok:0,list:rounds.map(t=>({t,opts:shuffle([t,...shuffle(all.filter(x=>x!==t)).slice(0,2)])}))};
 gShow();
}
const short=h=>{const d=document.createElement('div');d.innerHTML=h;const t=d.innerHTML.split('。')[0];return t+'。'};
function gShow(){
 const g=G.list[G.i],w=C.words[g.t];
 app.innerHTML=`<div class="top"><button class="back" onclick="go(home)" aria-label="やめる">×</button><div class="prog"><i style="width:${G.i/G.list.length*100}%"></i></div><span class="pill">⭐ ${G.ok}</span></div>
 <div class="qno">ことばゲーム ${G.i+1} / ${G.list.length}</div><div class="gword"><ruby>${esc(g.t)}<rt>${esc(w.yomi)}</rt></ruby></div>
 <p class="muted" style="text-align:center">この<ruby>言葉<rt>ことば</rt></ruby>の<ruby>意味<rt>いみ</rt></ruby>はどれ？</p>
 <div id="gopts" class="gopts">${g.opts.map(o=>`<button class="sub" onclick="gAnswer('${esc(o)}')">${short(C.words[o].meanHtml)}</button>`).join('')}</div>`;
}
function gAnswer(o){
 const g=G.list[G.i],ok=o===g.t;if(ok)G.ok++;
 $('#gopts').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><div class="stage">${chara('mirai',ok?'happy':'sad',true)}<div><h3>${ok?'せいかい！':'ざんねん…'}</h3></div></div><div>${C.words[g.t].meanHtml}<br>💡 ${C.words[g.t].tatoeHtml}</div></div><div style="height:14px"></div><button class="big ${ok?'green':'blue'}" onclick="gNext()">${G.i+1<G.list.length?'つぎへ ›':'けっかを見る'}</button>`;
}
function gNext(){
 G.i++;if(G.i<G.list.length)return gShow();
 const coins=G.ok*5;S.coins+=coins;S.xp+=G.ok*5;touchStreak();save();logStudy({k:'game',ok:G.ok,n:G.list.length});const m=G.ok>=3&&completeMission();
 app.innerHTML=`${header('けっか')}${say('neko',G.ok>=4?'happy':'normal',G.ok===G.list.length?'ぜんぶわかったね！言葉はかせだワン！':'よくがんばったワン！また<ruby>遊<rt>あそ</rt></ruby>ぼう！',true)}
 <div class="earn">${G.ok} / ${G.list.length} もんせいかい　🪙 +${coins}</div><button class="big" onclick="go(wordgame)">もう1<ruby>回<rt>かい</rt></ruby></button><div style="height:12px"></div><button class="sub" onclick="go(home)">ホームへ</button>`;
 confetti();if(m)setTimeout(()=>toast(`🎯 ミッションクリア！ 🪙 +${MISSION}`),900);
}

const jitenPct=()=>Math.floor(Object.keys(S.words).length/Object.keys(C.words).length*100);
function zukan(open){
 const got=Object.keys(S.words).length,all=Object.keys(C.words).length,pct=jitenPct(),seen=new Set();
 const shelves=C.chapters.map(c=>{const ws=[];for(const l of c.lessons)for(const w of l.words)if(!seen.has(w)&&C.words[w]){seen.add(w);ws.push(w)}return {c,ws}}).filter(x=>x.ws.length);
 const card=w=>S.words[w]?`<button class="card w${CHO[w]?' super':''}" data-w="${esc(w)}"><ruby>${esc(w)}<rt>${esc(C.words[w].yomi)}</rt></ruby></button>`:'<div class="card lock">？</div>';
 app.innerHTML=`${header('たっけんようごじてん','go(home)')}
 <div class="jiten-top"><div><b>コンプリート<ruby>率<rt>りつ</rt></ruby></b><strong>${pct}<small>%</small></strong></div><div class="bar"><i style="width:${pct}%"></i></div><span>${got} / ${all}<ruby>語<rt>ご</rt></ruby>　⭐は「ひとことで<ruby>言<rt>い</rt></ruby>うと」つき</span></div>
 <p class="muted" style="text-align:center">レッスンでクリアしたり、きいろの<ruby>言葉<rt>ことば</rt></ruby>をタップすると<ruby>登録<rt>とうろく</rt></ruby>されるよ</p>
 ${shelves.map(({c,ws},i)=>{const g=ws.filter(w=>S.words[w]).length;return `<details class="shelf-ch" ${open===c.id||(open===undefined&&g&&g<ws.length)?'open':''}><summary><span>${c.titleHtml}</span><em class="${g===ws.length?'full':''}">${g===ws.length?'👑 ':''}${g} / ${ws.length}</em></summary><div class="cards">${ws.map(card).join('')}</div></details>`}).join('')}`;
}

function grown(st){
 S.seenStage=st;save();confetti();
 app.innerHTML=`${header('せいちょうした！')}<div class="growstage">${avatarHTML(S.look,st,'happy','full')}</div>
 ${say('neko','happy',`すごいワン！${esc(S.name)}ちゃんは<b>${STAGES[st].name}</b>に<ruby>成長<rt>せいちょう</rt></ruby>したよ！<br>あたらしいアイテムが<ruby>買<rt>か</rt></ruby>えるようになったワン！`,true)}
 <button class="big" onclick="go(closet)">👗 きせかえを見る</button><div style="height:12px"></div><button class="sub" onclick="go(home)">ホームへ</button>`;
}

let closetTab='hair',tryOn=null;
function closet(tab){
 if(tab)closetTab=tab;
 const st=myStage(),look=tryOn?{...S.look,[tryOn.cat]:tryOn.id}:S.look;
 // With illustrated art for this stage, dress-up is by whole outfit (コーデ) plus background.
 // Only this stage's outfits (and the next stage's, shown locked as something to look forward to).
 const arts=ART.filter(a=>a.st===st||a.st===st+1),artMode=!!artFor(S.look,st),hairArts=arts.filter(a=>a.kind==='hair');
 const tabs=artMode?[['coord','コーデ'],...(hairArts.length?[['hairart','<ruby>髪型<rt>かみがた</rt></ruby>']]:[]),...CATS.filter(c=>['bg','fx','pet'].includes(c[0]))]:CATS;
 if(!tabs.some(t=>t[0]===closetTab))closetTab=tabs[0][0];
 const items=closetTab==='coord'?arts.filter(a=>a.kind!=='hair').map(a=>({...a,cat:'coord'})):closetTab==='hairart'?hairArts.map(a=>({...a,cat:'coord'})):ITEMS.filter(i=>i.cat===closetTab).sort((a,b)=>b.id.startsWith('w_')-a.id.startsWith('w_')); // illustrated worlds first
 app.innerHTML=`${header('きせかえ','tryOn=null;go(home)')}
 <div class="closet-top"><div class="closet-fig">${avatarHTML(look,st,'happy','full')}</div><div class="closet-side"><span class="pill">🪙 ${S.coins}</span><span class="stg">${STAGES[st].name}</span>${tryOn?'':`<button class="gacha-btn" onclick="go(gacha)">🎁 ガチャ<small>🪙 ${GACHA}</small></button>`}${tryOn?`<div class="tryon">${tryOn.name}<br>🪙 ${tryOn.p}</div><button class="big" style="font-size:17px;padding:12px" onclick="buy('${tryOn.id}')" ${S.coins<tryOn.p?'disabled':''}>${S.coins<tryOn.p?'コインが足りない':'かう！'}</button><button class="sub" style="font-size:15px;padding:10px;margin-top:8px" onclick="tryOn=null;closet()">やめる</button>`:''}</div></div>
 <div class="ctabs">${tabs.map(([c,n])=>`<button class="${c===closetTab?'on':''}" onclick="tryOn=null;closet('${c}')">${n}</button>`).join('')}</div>
 ${closetTab==='hairart'?'<p class="muted" style="text-align:center">パーカーコーデの<ruby>髪型<rt>かみがた</rt></ruby>だよ。ほかの<ruby>服<rt>ふく</rt></ruby>の<ruby>髪型<rt>かみがた</rt></ruby>はこれから<ruby>増<rt>ふ</rt></ruby>えるワン！</p>':''}
 <div class="shelf">${items.map(i=>{const own=S.owned.includes(i.id),lock=i.st>st,on=(i.cat==='coord'?artFor(S.look,st)?.id:S.look[i.cat])===i.id;return `<button class="it${on?' on':''}${lock?' lock':''}" onclick="pick('${i.id}')">${thumb(i)}<span class="itname">${lock?'🔒 ':''}${i.name}</span><small>${on?'きている':own?'もっている':lock?`${STAGES[i.st].name}から`:`🪙 ${i.p}`}</small></button>`}).join('')}</div>
 <p class="muted" style="text-align:center">コインはクイズで<ruby>正解<rt>せいかい</rt></ruby>するともらえるよ</p>`;
}
// Small picture on each closet tile: the scene itself, or the pet / effect symbol, or the outfit art.
function thumb(i){
 if(i.cat==='bg')return `<span class="thumb"><svg viewBox="0 0 200 320" preserveAspectRatio="xMidYMid slice">${bgLayer(i.id)}</svg></span>`;
 if(i.kind==='hair')return `<span class="thumb hairthumb"><img src="${i.file}" alt="" style="height:230%;display:block;margin:-3% auto 0"></span>`; // upper body, so the whole hairstyle shows
 if(i.cat==='coord')return `<span class="thumb"><img src="${i.file}" alt="" style="height:100%;display:block;margin:auto"></span>`;
 if(i.img)return `<span class="thumb fxthumb"><img src="art/pet/${i.img}.png" alt=""></span>`;
 if(i.fx)return `<span class="thumb fxthumb"><img src="art/fx/${i.fx}.png" alt=""></span>`;
 if(i.e)return `<span class="thumb emo">${Array.isArray(i.e)?i.e.slice(0,2).join(''):i.e}</span>`;
 return i.cat==='fx'||i.cat==='pet'?'<span class="thumb emo">－</span>':'';
}
function pick(id){
 const i=item(id)||{...ART.find(a=>a.id===id),cat:'coord'},st=myStage();
 if(i.st>st){tryOn=null;closet();toast(`${STAGES[i.st].name}になったら<ruby>買<rt>か</rt></ruby>えるよ！レベルを上げよう！`);return}
 if(S.owned.includes(id)){S.look[i.cat]=id;tryOn=null;save();closet();return}
 tryOn=i;closet();
}
function buy(id){
 const i=item(id)||{...ART.find(a=>a.id===id),cat:'coord'};if(S.coins<i.p)return;
 S.coins-=i.p;S.owned.push(id);S.look[i.cat]=id;tryOn=null;save();confetti();closet();toast(`「${i.name}」をゲット！`);
}
// Gacha: a random item she doesn't own yet, from what her stage allows. Cheaper items come up more often.
const GACHA=50;
function gachaPool(){const st=myStage();return ITEMS.filter(i=>['bg','fx','pet'].includes(i.cat)&&i.p>0&&i.st<=st&&!S.owned.includes(i.id))}
function gacha(){
 const pool=gachaPool();
 app.innerHTML=`${header('ガチャ','go(closet)')}<div class="gacha"><div class="capsule" id="cap">🎁</div>
 <p class="muted" style="text-align:center">${pool.length?`まだ持っていない<ruby>背景<rt>はいけい</rt></ruby>・エフェクト・おともが<ruby>当<rt>あ</rt></ruby>たるよ！（のこり${pool.length}こ）`:'ぜんぶ<ruby>集<rt>あつ</rt></ruby>めたよ！すごい！'}</p>
 <span class="pill">🪙 ${S.coins}</span><div style="height:14px"></div>
 <button class="big" id="spin" ${S.coins<GACHA||!pool.length?'disabled':''} onclick="spin()">${S.coins<GACHA?'コインが<ruby>足<rt>た</rt></ruby>りない':`🪙 ${GACHA} でまわす！`}</button></div>`;
}
function spin(){
 const pool=gachaPool();if(S.coins<GACHA||!pool.length)return;
 const weights=pool.map(i=>1/i.p),sum=weights.reduce((a,b)=>a+b,0);let r=Math.random()*sum,it=pool[0];
 for(let k=0;k<pool.length;k++){r-=weights[k];if(r<=0){it=pool[k];break}}
 S.coins-=GACHA;S.owned.push(it.id);save();
 $('#spin').disabled=true;$('#cap').classList.add('shake');
 setTimeout(()=>{
  const rare=it.p>=150?3:it.p>=100?2:1,look={...S.look,[it.cat]:it.id};
  app.innerHTML=`${header('ガチャ','go(closet)')}<div class="gacha"><div class="rare r${rare}">${'★'.repeat(rare)}</div><div class="gfig">${avatarHTML(look,myStage(),'happy','full')}</div>
  <h2 class="gname">${it.name}</h2><p class="muted" style="text-align:center">${CATS.find(c=>c[0]===it.cat)[1]}をゲット！</p>
  <button class="big" onclick="S.look['${it.cat}']='${it.id}';save();go(closet,'${it.cat}')">つけてみる</button><div style="height:12px"></div><button class="sub" onclick="go(gacha)">もう1回</button></div>`;
  confetti();
 },1300);
}
function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

function settings(){
 app.innerHTML=`${header('せってい','go(home)')}
 <div class="set"><label>なまえ<input class="field" id="nm" value="${esc(S.name)}" maxlength="10" style="margin:0;width:55%;font-size:18px;padding:8px"></label></div>
 <div class="set"><label>あいぼうの<ruby>名前<rt>なまえ</rt></ruby><input class="field" id="bn" value="${esc(S.buddy.name)}" maxlength="8" style="margin:0;width:55%;font-size:18px;padding:8px"></label></div>
 <div class="set"><label>ふりがなを出す<input type="checkbox" id="fu" ${S.furi?'checked':''}></label></div>
 <div class="set"><label>レッスンを<ruby>自動<rt>じどう</rt></ruby>でよみあげ<input type="checkbox" id="ar" ${S.autoRead?'checked':''}></label></div>
 <div class="set"><label>よみあげの<ruby>速<rt>はや</rt></ruby>さ<input type="range" id="rt" min="0.6" max="1.3" step="0.05" value="${S.rate}"></label><button class="sub" style="margin-top:10px" onclick="speak('たっけんクエストへようこそ。いっしょにがんばろうワン！')">🔊 ためしによむ</button></div>
 <button class="big" onclick="setSave()">ほぞんする</button>
 <div class="set" style="margin-top:22px"><b>👨‍👩‍👧 おうちの<ruby>人<rt>ひと</rt></ruby>コード</b><div class="pcode">${pcodeShow()}</div><p class="muted">おうちの<ruby>人<rt>ひと</rt></ruby>がこのコードを<ruby>入<rt>い</rt></ruby>れると、<ruby>勉強<rt>べんきょう</rt></ruby>のがんばりを<ruby>見<rt>み</rt></ruby>られるよ。</p></div>`;
}
function setSave(){S.name=$('#nm').value.trim()||S.name;S.buddy.name=$('#bn').value.trim()||S.buddy.name;S.furi=$('#fu').checked;S.autoRead=$('#ar').checked;S.rate=+$('#rt').value;save();applyFuri();go(home)}
function applyFuri(){document.body.classList.toggle('nofuri',!S.furi)}

// ---------- start ----------
fetch('data/course.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{C=d;applyFuri();home();syncSoon()}).catch(()=>{app.innerHTML='<p style="margin:auto;text-align:center">よみこみに<ruby>失敗<rt>しっぱい</rt></ruby>しました。<br>もう<ruby>一度<rt>いちど</rt></ruby>ひらいてね。</p>'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
